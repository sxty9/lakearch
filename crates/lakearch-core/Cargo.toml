[package]
name = "lakearch-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "lakearch kernel substrate: append-only content-addressed graph store, traversal, gate"

[dependencies]
blake3 = { workspace = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
memmap2 = "0.9"
redb = "2"
thiserror = { workspace = true }

[dev-dependencies]
minicbor = { version = "2.2.2", default-features = false, features = ["alloc"] }
tempfile = "3"
