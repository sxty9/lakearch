[package]
name = "lakearchd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "lakearchd — der lakearch-Daemon: ein Bestand (ein LakearchKernel) hinter einer Schreib-Pipeline, mit gegateten Kernel-Primitiven über gRPC (tonic)."

[[bin]]
name = "lakearchd"
path = "src/main.rs"

[lib]
name = "lakearchd"
path = "src/lib.rs"

[dependencies]
lakearch-core = { path = "../lakearch-core" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
